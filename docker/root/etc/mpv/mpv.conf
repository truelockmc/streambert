# mpv defaults for the Streambert container.
# The window is streamed to the browser, so open it fullscreen on top.
fullscreen=yes
ontop=yes
# Fallback if fullscreen is ever left: still cover the whole screen.
window-maximized=yes
geometry=0:0
autofit=100%x100%
keep-open=no
# Software decoding unless a GPU is passed through with /dev/dri.
hwdec=auto-safe

# The player UI is uosc (/etc/mpv/scripts/uosc, styled in
# /etc/mpv/script-opts/uosc.conf). It replaces mpv's built-in controls.
osc=no
osd-bar=no
border=no

# Subtitles: a bit smaller and lifted clear of the control bar.
sub-font-size=42
sub-border-size=2.5
sub-shadow-offset=1
sub-margin-y=60

# Mouse/keyboard controls that feel like a web player (uosc handles its own
# buttons). The player always fills the browser tab, so there is no
# "leave fullscreen": Esc closes the player and returns to Streambert.
ESC           quit
f             ignore
MBTN_LEFT     cycle pause
MBTN_LEFT_DBL ignore
# Right-click opens the uosc menu (tracks, chapters, speed, ...).
MBTN_RIGHT    script-binding uosc/menu

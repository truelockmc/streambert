# uosc player UI, styled to match Streambert. Options not listed use uosc's
# defaults: https://github.com/tomasklaen/uosc/blob/main/src/uosc.conf

# Solid red progress bar that grows on hover, like the app's own player.
timeline_style=bar
timeline_size=36
# Keep a thin progress line visible even when the controls are hidden.
progress=always
progress_size=3

# Streambert red accent (#e50914) with white text on it.
color=foreground=e50914,foreground_text=ffffff,background=0a0a0a,background_text=ffffff
border_radius=6

# Only the controls that matter for watching a downloaded episode.
# (No fullscreen button: the player always fills the tab; Esc closes it.)
controls=menu,gap,subtitles,<has_many_audio>audio,<has_many_video>video,gap,space,speed,space

# Always fullscreen in the container, so use one consistent size.
scale=1.2
scale_fullscreen=1.2

# Title + close button at the top when the mouse moves.
top_bar=no-border
top_bar_title=yes
top_bar_controls=right
